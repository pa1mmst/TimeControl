<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroManager</title>
    <meta name="theme-color" content="#2b7a4b">

    <!-- Telegram Mini App SDK (обязательный скрипт для работы внутри Telegram) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Стили приложения (файл styles.css появится на следующем шаге) -->
    <link rel="stylesheet" href="/app/static/styles.css">
</head>
<body>

    <div id="app">

        <!-- ============================================= -->
        <!-- ШАПКА ПРИЛОЖЕНИЯ                             -->
        <!-- ============================================= -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">AgroManager</h1>
            </div>
            <div class="header-right">
                <select id="langSelect" class="lang-select" title="Язык / Language">
                    <option value="ru" selected>РУ</option>
                    <option value="uk">УК</option>
                    <option value="es">ES</option>
                </select>
            </div>
        </header>

        <!-- ============================================= -->
        <!-- ОСНОВНОЕ СОДЕРЖИМОЕ                          -->
        <!-- Каждый экран — отдельная секция .screen.     -->
        <!-- Виден только тот экран, у которого нет       -->
        <!-- атрибута hidden (переключение делает JS).    -->
        <!-- ============================================= -->
        <main class="app-content" id="appContent">

            <!-- Экран: загрузка -->
            <section class="screen is-active" id="screenLoading" data-screen-name="loading">
                <div class="loader"></div>
                <p class="screen-message" data-i18n="loading">Загрузка...</p>
            </section>

            <!-- Экран: авторизация / вход -->
            <section class="screen" id="screenLogin" data-screen-name="login" hidden>
                <h2 data-i18n="loginTitle">Вход</h2>
                <p data-i18n="loginSubtitle">Проверка данных пользователя...</p>
            </section>

            <!-- Экран: главная (сводка) -->
            <section class="screen" id="screenDashboard" data-screen-name="dashboard" hidden>
                <h2 data-i18n="dashboardTitle">Главная</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-value" id="statActiveTasks">0</span>
                        <span class="stat-label" data-i18n="statActiveTasks">Активных заданий</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="statHoursToday">0</span>
                        <span class="stat-label" data-i18n="statHoursToday">Часов за сегодня</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="statEarned">0</span>
                        <span class="stat-label" data-i18n="statEarned">Начислено</span>
                    </div>
                </div>
            </section>

            <!-- Экран: список заданий -->
            <section class="screen" id="screenTasks" data-screen-name="tasks" hidden>
                <div class="screen-header">
                    <h2 data-i18n="tasksTitle">Задания</h2>
                    <button class="btn btn-primary" id="btnNewTask" hidden data-i18n="tasksNew">Новое задание</button>
                </div>
                <div class="list" id="tasksList">
                    <!-- Карточки заданий будет добавлять script.js -->
                </div>
            </section>

            <!-- Экран: детали задания -->
            <section class="screen" id="screenTaskDetail" data-screen-name="task-detail" hidden>
                <button class="btn btn-back" id="btnBackTasks" data-i18n="back">← Назад</button>
                <h2 id="taskDetailTitle">Задание</h2>
                <div class="detail-content" id="taskDetailContainer">
                    <!-- Информация о задании: заказчик, локация, участники, часы -->
                </div>
            </section>

            <!-- Экран: рабочие часы -->
            <section class="screen" id="screenHours" data-screen-name="hours" hidden>
                <div class="screen-header">
                    <h2 data-i18n="hoursTitle">Рабочие часы</h2>
                    <button class="btn btn-primary" id="btnAddHours" hidden data-i18n="hoursAdd">Добавить часы</button>
                </div>
                <div class="list" id="hoursList">
                    <!-- Записи о часах будет добавлять script.js -->
                </div>
            </section>

            <!-- Экран: отчёты -->
            <section class="screen" id="screenReports" data-screen-name="reports" hidden>
                <h2 data-i18n="reportsTitle">Отчёты</h2>
                <div class="list" id="reportsList">
                    <!-- Список доступных отчётов -->
                </div>
            </section>

            <!-- Экран: сотрудники (для руководителя) -->
            <section class="screen" id="screenTeam" data-screen-name="team" hidden>
                <div class="screen-header">
                    <h2 data-i18n="teamTitle">Сотрудники</h2>
                    <button class="btn btn-primary" id="btnAddWorker" hidden data-i18n="teamAdd">Добавить</button>
                </div>
                <div class="list" id="teamList">
                    <!-- Карточки сотрудников -->
                </div>
            </section>

            <!-- Экран: заказчики и локации (для руководителя) -->
            <section class="screen" id="screenClients" data-screen-name="clients" hidden>
                <div class="screen-header">
                    <h2 data-i18n="clientsTitle">Заказчики</h2>
                    <button class="btn btn-primary" id="btnAddClient" hidden data-i18n="clientsAdd">Добавить</button>
                </div>
                <div class="list" id="clientsList">
                    <!-- Карточки заказчиков -->
                </div>
            </section>

            <!-- Экран: инвентарь (для руководителя) -->
            <section class="screen" id="screenInventory" data-screen-name="inventory" hidden>
                <h2 data-i18n="inventoryTitle">Инвентарь</h2>
                <div class="list" id="inventoryList">
                    <!-- Записи инвентаря -->
                </div>
            </section>

            <!-- Экран: выплаты (для руководителя) -->
            <section class="screen" id="screenPayments" data-screen-name="payments" hidden>
                <h2 data-i18n="paymentsTitle">Выплаты</h2>
                <div class="list" id="paymentsList">
                    <!-- Периоды и статусы выплат -->
                </div>
            </section>

            <!-- Экран: профиль -->
            <section class="screen" id="screenProfile" data-screen-name="profile" hidden>
                <h2 data-i18n="profileTitle">Профиль</h2>
                <div id="profileInfo">
                    <!-- Данные пользователя: имя, роль, ставка, инвентарь -->
                </div>
            </section>

        </main>

        <!-- ============================================= -->
        <!-- НИЖНЯЯ НАВИГАЦИЯ                             -->
        <!-- Видимые пункты для всех пользователей.       -->
        <!-- Дополнительные пункты руководителя — в меню  -->
        <!-- «Ещё» (#moreMenu).                           -->
        <!-- ============================================= -->
        <nav class="app-nav" id="appNav">
            <button class="nav-item" data-nav-target="dashboard">
                <span class="nav-icon">🏠</span>
                <span class="nav-label" data-i18n="navDashboard">Главная</span>
            </button>
            <button class="nav-item" data-nav-target="tasks">
                <span class="nav-icon">📋</span>
                <span class="nav-label" data-i18n="navTasks">Задания</span>
            </button>
            <button class="nav-item" data-nav-target="hours">
                <span class="nav-icon">⏱️</span>
                <span class="nav-label" data-i18n="navHours">Часы</span>
            </button>
            <button class="nav-item" data-nav-target="reports">
                <span class="nav-icon">📊</span>
                <span class="nav-label" data-i18n="navReports">Отчёты</span>
            </button>
            <button class="nav-item" id="navProfileBtn" data-nav-target="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label" data-i18n="navProfile">Профиль</span>
            </button>
            <button class="nav-item" id="navMoreBtn" data-nav-target="more" hidden>
                <span class="nav-icon">☰</span>
                <span class="nav-label" data-i18n="navMore">Ещё</span>
            </button>
        </nav>

        <!-- Дополнительное меню руководителя -->
        <div class="more-menu" id="moreMenu" hidden>
            <button class="more-menu-item" data-nav-target="team">
                <span>👥</span> <span data-i18n="navTeam">Сотрудники</span>
            </button>
            <button class="more-menu-item" data-nav-target="clients">
                <span>🏢</span> <span data-i18n="navClients">Заказчики</span>
            </button>
            <button class="more-menu-item" data-nav-target="inventory">
                <span>🧰</span> <span data-i18n="navInventory">Инвентарь</span>
            </button>
            <button class="more-menu-item" data-nav-target="payments">
                <span>💰</span> <span data-i18n="navPayments">Выплаты</span>
            </button>
        </div>

    </div>

    <!-- ============================================= -->
    <!-- БАЗОВАЯ ИНИЦИАЛИЗАЦИЯ TELEGRAM MINI APP       -->
    <!-- Это не бизнес-логика, а обязательные настройки -->
    <!-- для корректной работы внутри Telegram.        -->
    <!-- ============================================= -->
    <script>
        (function () {
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();

                // Передаём тему Telegram (светлая/тёмная) в CSS
                document.documentElement.setAttribute('data-theme', Telegram.WebApp.colorScheme || 'light');
            }
        })();
    </script>

    <!-- Логика приложения (файл script.js появится позже) -->
    <script src="/app/static/app.js"></script>

</body>
</html>
