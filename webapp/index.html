<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroManager</title>
    <meta name="theme-color" content="#0E1412">

    <!-- Telegram Mini App SDK (обязательный скрипт для работы внутри Telegram) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Стили приложения (v=6: новая дизайн-система, тёмная тема) -->
    <link rel="stylesheet" href="/app/static/styles.css?v=6">
</head>
<body>

    <div id="app">

        <!-- ============================================= -->
        <!-- ШАПКА: лого-марка + название фирмы + роль/дата -->
        <!-- ============================================= -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-mark" aria-hidden="true">A</div>
                <div class="header-titles">
                    <div id="headerOrg" class="app-header__org"></div>
                    <div id="headerMeta" class="app-header__meta"></div>
                </div>
            </div>
            <div class="header-right">
                <select id="langSelect" class="lang-select" title="Язык / Language">
                    <option value="ru" selected>РУ</option>
                    <option value="uk">УК</option>
                    <option value="es">ES</option>
                </select>
            </div>
        </header>

        <!-- ============================================= -->
        <!-- ОСНОВНОЕ СОДЕРЖИМОЕ                          -->
        <!-- Каждый экран — отдельная секция .screen.     -->
        <!-- Виден только тот экран, у которого нет       -->
        <!-- атрибута hidden (переключение делает JS).    -->
        <!-- ============================================= -->
        <main class="app-content" id="appContent">

            <!-- Экран: загрузка -->
            <section class="screen is-active" id="screenLoading" data-screen-name="loading">
                <div class="loader"></div>
                <p class="screen-message" data-i18n="loading">Загрузка...</p>
            </section>

            <!-- Экран: авторизация / вход -->
            <section class="screen" id="screenLogin" data-screen-name="login" hidden>
                <h2 data-i18n="loginTitle">Вход</h2>
                <p data-i18n="loginSubtitle">Проверка данных пользователя...</p>
            </section>

            <!-- Экран: главная (сводка) -->
            <section class="screen" id="screenDashboard" data-screen-name="dashboard" hidden>
                <div id="dashboardBody">
                    <!-- Содержимое собирает app.js по роли -->
                </div>
            </section>

            <!-- Экран: список заданий -->
            <section class="screen" id="screenTasks" data-screen-name="tasks" hidden>
                <div class="screen-header">
                    <h2 data-i18n="tasksTitle">Задания</h2>
                    <button class="btn btn--primary" id="btnNewTask" hidden data-i18n="tasksNew">Новое задание</button>
                </div>
                <div class="list" id="tasksList">
                    <!-- Карточки заданий будет добавлять app.js -->
                </div>
            </section>

            <!-- Экран: форма «Новое задание» (руководитель) -->
            <section class="screen" id="screenNewTask" data-screen-name="new-task" hidden>
                <button class="btn btn-back" id="btnBackNewTask" data-i18n="back">← Назад</button>
                <h2 data-i18n="newTaskTitle">Новое задание</h2>
                <form id="newTaskForm" class="form">
                    <label class="form-field">
                        <span class="form-label" data-i18n="taskTitle">Название</span>
                        <input type="text" id="ntTitle" required>
                    </label>
                    <label class="form-field">
                        <span class="form-label" data-i18n="taskDescr">Описание</span>
                        <textarea id="ntDescr" rows="2"></textarea>
                    </label>
                    <label class="form-field">
                        <span class="form-label" data-i18n="taskClient">Заказчик</span>
                        <select id="ntClient" required>
                            <option value="">—</option>
                        </select>
                    </label>
                    <div class="form-field" id="ntLocationsField" hidden>
                        <span class="form-label" data-i18n="taskLocations">Локации</span>
                        <div class="chip-row" id="ntLocations"></div>
                    </div>
                    <div class="form-field">
                        <span class="form-label" data-i18n="taskWorkers">Сотрудники</span>
                        <div class="chip-row" id="ntWorkers"></div>
                    </div>
                    <div class="form-field" id="ntReporterField" hidden>
                        <span class="form-label" data-i18n="taskReporter">Учётчик</span>
                        <div class="chip-row" id="ntReporter"></div>
                    </div>
                    <label class="form-field">
                        <span class="form-label" data-i18n="taskDateStart">Дата</span>
                        <input type="date" id="ntDateStart">
                    </label>
                    <label class="check-item">
                        <input type="checkbox" id="ntMultiDay">
                        <span data-i18n="taskMultiDay">Несколько дней</span>
                    </label>
                    <label class="form-field" id="ntDateEndField" hidden>
                        <span class="form-label" data-i18n="taskDateEnd">По дату</span>
                        <input type="date" id="ntDateEnd">
                    </label>
                    <p class="form-error" id="ntError" hidden></p>
                    <button type="submit" class="btn btn--primary btn--block" id="ntSubmit" data-i18n="save">Создать</button>
                </form>
            </section>

            <!-- Экран: отчёты (две вкладки: Сводка | Выплаты) -->
            <section class="screen" id="screenReports" data-screen-name="reports" hidden>
                <h2 data-i18n="reportsTitle">Отчёты</h2>
                <div class="segment" id="reportsSegment">
                    <button class="segment__btn is-active" data-reports-tab="summary" data-i18n="tabSummary">Сводка</button>
                    <button class="segment__btn" data-reports-tab="payouts" data-i18n="tabPayouts" hidden>Выплаты</button>
                </div>
                <div id="reportsBody"></div>
            </section>

            <!-- Экран: сотрудники (для руководителя) -->
            <section class="screen" id="screenTeam" data-screen-name="team" hidden>
                <div class="screen-header">
                    <h2 data-i18n="teamTitle">Сотрудники</h2>
                    <button class="btn btn--primary" id="btnAddWorker" hidden data-i18n="teamAdd">Добавить</button>
                </div>
                <form id="teamAddForm" class="form" hidden>
                    <label class="form-field">
                        <span class="form-label" data-i18n="workerName">Имя</span>
                        <input type="text" id="twName" required>
                    </label>
                    <label class="form-field">
                        <span class="form-label" data-i18n="workerPhone">Телефон</span>
                        <input type="tel" id="twPhone">
                    </label>
                    <label class="form-field">
                        <span class="form-label" data-i18n="workerRate">Ставка/час</span>
                        <input type="number" id="twRate" min="0" step="0.01">
                    </label>
                    <p class="form-error" id="twError" hidden></p>
                    <button type="submit" class="btn btn--primary btn--block" id="twSubmit" data-i18n="save">Создать</button>
                </form>
                <div class="list" id="teamList">
                    <!-- Карточки сотрудников -->
                </div>
            </section>

            <!-- Экран: заказчики и локации (для руководителя) -->
            <section class="screen" id="screenClients" data-screen-name="clients" hidden>
                <div class="screen-header">
                    <h2 data-i18n="clientsTitle">Заказчики</h2>
                    <button class="btn btn--primary" id="btnAddClient" hidden data-i18n="clientsAdd">Добавить</button>
                </div>
                <form id="clientAddForm" class="form" hidden>
                    <label class="form-field">
                        <span class="form-label" data-i18n="clientName">Название</span>
                        <input type="text" id="clName" required>
                    </label>
                    <label class="form-field">
                        <span class="form-label" data-i18n="clientNotes">Заметки</span>
                        <textarea id="clNotes" rows="2"></textarea>
                    </label>
                    <p class="form-error" id="clError" hidden></p>
                    <button type="submit" class="btn btn--primary btn--block" id="clSubmit" data-i18n="save">Создать</button>
                </form>
                <div class="list" id="clientsList">
                    <!-- Карточки заказчиков -->
                </div>
            </section>

            <!-- Экран: инвентарь -->
            <section class="screen" id="screenInventory" data-screen-name="inventory" hidden>
                <div class="screen-header">
                    <h2 data-i18n="inventoryTitle">Инвентарь</h2>
                    <button class="btn btn--primary" id="btnAddItem" hidden data-i18n="teamAdd">Добавить</button>
                </div>
                <form id="invAddForm" class="form" hidden>
                    <label class="form-field">
                        <span class="form-label" data-i18n="itemName">Предмет</span>
                        <input type="text" id="invName" required>
                    </label>
                    <label class="form-field">
                        <span class="form-label" data-i18n="itemNotes">Заметки</span>
                        <textarea id="invNotes" rows="2"></textarea>
                    </label>
                    <p class="form-error" id="invError" hidden></p>
                    <button type="submit" class="btn btn--primary btn--block" id="invSubmit" data-i18n="save">Создать</button>
                </form>
                <div class="list" id="inventoryList">
                    <!-- Записи инвентаря -->
                </div>
            </section>

            <!-- Экран: ввод часов (полноэкранный, открывается из задания) -->
            <section class="screen" id="screenHoursEntry" data-screen-name="hours-entry" hidden>
                <button class="btn btn-back" id="btnBackHoursEntry" data-i18n="back">← Назад</button>
                <h2 data-i18n="hoursEntryTitle">Часы за работу</h2>
                <p class="screen-message" id="heTaskTitle"></p>
                <div class="form">
                    <button type="button" class="he-date" id="heDateBtn"></button>
                    <input type="date" id="heDate" hidden>
                    <label class="check-item he-same">
                        <input type="checkbox" id="heSame">
                        <span data-i18n="hoursSameAll">Всем одинаково</span>
                    </label>
                    <p class="screen-message" id="heSameHint" hidden data-i18n="hoursSameHint"></p>
                    <div class="he-quick" id="heQuick">
                        <button type="button" class="chip" data-quick="4">4</button>
                        <button type="button" class="chip" data-quick="8">8</button>
                        <button type="button" class="chip" data-quick="10">10</button>
                        <button type="button" class="chip" data-quick="12">12</button>
                    </div>
                    <div class="list" id="hePeople"></div>
                    <div class="form-field" id="heReasonField" hidden>
                        <span class="form-label" data-i18n="hoursReason">Почему меняете часы?</span>
                        <input type="text" id="heReason" data-i18n-placeholder="hoursReasonHint">
                    </div>
                    <p class="form-error" id="heError" hidden></p>
                </div>
                <div class="he-sticky">
                    <button class="btn btn--primary btn--block he-save" id="heSave" data-i18n="save">Сохранить</button>
                    <p class="screen-message" id="heHint" data-i18n="hoursHintEmpty"></p>
                </div>
            </section>

        </main>

        <!-- ============================================= -->
        <!-- НИЖНЯЯ НАВИГАЦИЯ: 5 пунктов, инлайн SVG       -->
        <!-- ============================================= -->
        <nav class="bottom-nav" id="bottomNav">
            <button class="bottom-nav__item" data-nav-target="dashboard">
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
                <span class="nav-label" data-i18n="navDashboard">Главная</span>
            </button>
            <button class="bottom-nav__item" data-nav-target="tasks">
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
                <span class="nav-label" data-i18n="navTasks">Задания</span>
            </button>
            <button class="bottom-nav__item" data-nav-target="reports">
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
                <span class="nav-label" data-i18n="navReports">Отчёты</span>
            </button>
            <button class="bottom-nav__item" data-nav-target="team" hidden>
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 15.2c2.8.2 4.8 1.8 5.5 4.5"/></svg>
                <span class="nav-label" data-i18n="navTeam">Команда</span>
            </button>
            <button class="bottom-nav__item" data-nav-target="inventory" hidden>
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 12h18"/></svg>
                <span class="nav-label" data-i18n="navInventory">Инвентарь</span>
            </button>
            <button class="bottom-nav__item" data-nav-target="more">
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
                <span class="nav-label" data-i18n="navMore">Ещё</span>
            </button>
        </nav>

        <!-- Корень bottom sheet'ов и тостов -->
        <div id="sheetRoot"></div>
        <div id="toastRoot"></div>

    </div>

    <!-- ============================================= -->
    <!-- БАЗОВАЯ ИНИЦИАЛИЗАЦИЯ TELEGRAM MINI APP       -->
    <!-- ============================================= -->
    <script>
        (function () {
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();

                // Передаём тему Telegram (светлая/тёмная) в CSS
                document.documentElement.setAttribute('data-theme', Telegram.WebApp.colorScheme || 'light');
            }
        })();
    </script>

    <!-- Логика приложения (v=6: экраны по ролям, листы, ввод часов из задания) -->
    <script src="/app/static/app.js?v=6"></script>

</body>
</html>
