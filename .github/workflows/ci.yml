name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tools tests

      - name: Frontend build is fresh (webapp/app.js = webapp/src + i18n.json)
        run: python tools/build_webapp.py --check

      - name: Tests (pytest)
        run: pytest -q

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

  browser:
    # Браузерные сценарии Mini App (tests/test_browser.py): uvicorn + Chromium.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Browser tests
        env:
          BROWSER_TESTS: "1"
        run: pytest tests/test_browser.py -v
